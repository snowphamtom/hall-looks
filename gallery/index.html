<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Gallery — Heavy Is The Crown</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050508; color:#f5f0e1; font-family:Georgia, serif; min-height:100vh; display:flex; flex-direction:column; }
  header { text-align:center; padding:32px 20px 16px; }
  header h1 { font-size:1.8em; letter-spacing:0.3em; font-weight:normal; }
  header p { color:#8a8578; margin-top:8px; letter-spacing:0.1em; font-size:0.9em; }
  .tabs { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; padding:16px; }
  .tab { background:#0c0c12; border:1px solid #2a2a35; color:#f5f0e1; padding:10px 20px; border-radius:24px; cursor:pointer; font-family:inherit; font-size:0.9em; letter-spacing:0.05em; transition:all .2s; }
  .tab:hover { border-color:#d4a843; }
  .tab.active { background:#d4a843; color:#050508; border-color:#d4a843; font-weight:bold; }
  .viewer { flex:1; position:relative; min-height:60vh; margin:0 16px; border:1px solid #2a2a35; border-radius:12px; overflow:hidden; background:#000; }
  .viewer iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
  .info-bar { text-align:center; padding:16px; color:#8a8578; font-size:0.95em; max-width:800px; margin:0 auto; line-height:1.6; }
  .info-bar b { color:#f5f0e1; }
  footer { text-align:center; padding:24px; color:#555; font-size:0.85em; }
</style>
</head>
<body>
<header>
  <h1>3D GALLERY</h1>
  <p>every interactive dimension — heavy is the crown</p>
</header>
<div class="tabs">
  <button class="tab active" data-src="../genesis-marvel/" data-title="GENESIS 7140" data-desc="<b>GENESIS 7140</b> — 1,128 pairs as golden pillars. 48 nodes, 7,140 doors. Click a node to isolate its world.">🌌 GENESIS</button>
  <button class="tab" data-src="../genesis-forest/" data-title="Beam Forest" data-desc="<b>Beam Forest</b> — all 1,128 beams as a walkable forest of light. Drag to orbit, scroll to zoom, hover a beam.">🌲 Forest</button>
  <button class="tab" data-src="../cathedral/" data-title="Cathedral" data-desc="<b>Cathedral — The Design Game</b> — reality-based design with CSG carving, Snow voice guide, and the Book of Doors.">⛪ Cathedral</button>
  <button class="tab" data-src="../workbench/" data-title="Workbench" data-desc="<b>Workbench</b> — 6 chassis, 10 materials, blueprint-to-hyperreal. PWA offline, measurement platform, turntable.">🔨 Workbench</button>
  <button class="tab" data-src="../tessera-bridge/" data-title="Tessera Bridge" data-desc="<b>Tessera Kernel Bridge</b> — twelve kernels, one bridge. Every visualization connected to the 48-node core.">🌉 Tessera</button>
  <button class="tab" data-src="../elemental/" data-title="Elemental" data-desc="<b>Human Body Elemental Recipe</b> — the 118 elements mapped to the human body. Quantum subshells, periodic vault.">🧬 Elemental</button>
</div>
<div class="viewer">
  <iframe id="view" src="../genesis-marvel/" allow="autoplay; fullscreen" title="3D viewer"></iframe>
</div>
<div class="info-bar" id="desc"><b>GENESIS 7140</b> — 1,128 pairs as golden pillars. 48 nodes, 7,140 doors. Click a node to isolate its world.</div>
<footer>every number on these pages is measured, not drawn</footer>
<script>
  const view = document.getElementById('view');
  const desc = document.getElementById('desc');
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      view.src = t.dataset.src;
      desc.innerHTML = t.dataset.desc;
    });
  });
</script>
</body>
</html>
