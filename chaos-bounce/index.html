<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CHAOS BOUNCE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07080c; font-family: -apple-system, system-ui, sans-serif; color: #d8dee8; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(7,8,12,0.9), transparent);
  }
  #hud .row { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 0.12em; color: #8b95a8; margin-bottom: 4px; }
  #hud .val { color: #e8eef8; font-variant-numeric: tabular-nums; }
  #msg {
    position: absolute; left: 0; right: 0; top: 40%; text-align: center;
    font-size: 15px; letter-spacing: 0.14em; color: #c5d0e0;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
    text-shadow: 0 0 20px rgba(90,140,255,0.4);
  }
  #msg.show { opacity: 1; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(7,8,12,0.88); padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 20px; letter-spacing: 0.28em; margin-bottom: 10px; }
  #overlay p { font-size: 13px; line-height: 1.55; color: #8a96aa; max-width: 300px; margin-bottom: 16px; }
  #overlay .warn { color: #e8a87c; font-size: 12px; margin-bottom: 20px; letter-spacing: 0.06em; }
  #overlay button {
    border: 1px solid #3d6abf; background: #152038; color: #e8eef8;
    border-radius: 14px; padding: 14px 28px; font-size: 14px; letter-spacing: 0.12em;
  }
</style>
</head>
<body>
<div id="hud">
  <div class="row"><span>CHAOS BOUNCE</span><span class="val" id="score">0</span></div>
  <div class="row"><span>BEST</span><span class="val" id="best">0</span></div>
  <div class="row"><span>STREAK</span><span class="val" id="streak">0</span></div>
</div>
<div id="msg"></div>
<div id="overlay">
  <h1>CHAOS BOUNCE</h1>
  <p>Keep the sphere airborne.<br>
  Every valid touch randomizes height, direction, and speed.<br>
  Miss the sphere — or let it fall — and you restart.</p>
  <div class="warn">EXTREME · UNPREDICTABLE · ONE MISS = FAIL</div>
  <button id="start">TOUCH TO BEGIN</button>
</div>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const msgEl = document.getElementById('msg');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const streakEl = document.getElementById('streak');

  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const GRAVITY = 0.28;
  const FLOOR_RATIO = 0.92;
  const BALL_R = 28;
  // Extremely nasty randomization ranges
  const SPEED_MIN = 8;
  const SPEED_MAX = 22;
  const ANGLE_SPREAD = Math.PI * 0.95; // almost any upward-ish / sideways chaos
  const HIT_SHRINK = 0.82; // must touch actual ball; slightly mean hitbox feel via motion

  let running = false;
  let score = 0;
  let best = Number(localStorage.getItem('chaos_bounce_best') || 0);
  let streak = 0;
  let msgT = 0;
  let particles = [];
  let shake = 0;

  const ball = {
    x: 0, y: 0,
    vx: 0, vy: 0,
    r: BALL_R,
    hue: 210,
  };

  bestEl.textContent = best;

  function flash(t) {
    msgEl.textContent = t;
    msgEl.classList.add('show');
    msgT = 50;
  }

  function resetBall(initial) {
    ball.x = W * 0.5;
    ball.y = H * 0.35;
    ball.r = BALL_R;
    ball.hue = 200 + Math.random() * 80;
    if (initial) {
      ball.vx = (Math.random() - 0.5) * 3;
      ball.vy = -6 - Math.random() * 3;
    }
  }

  function fail(reason) {
    running = false;
    streak = 0;
    streakEl.textContent = '0';
    if (score > best) {
      best = score;
      localStorage.setItem('chaos_bounce_best', String(best));
      bestEl.textContent = best;
    }
    overlay.classList.remove('hidden');
    overlay.querySelector('p').innerHTML =
      `<b>${reason}</b><br>Score ${score} · Best ${best}<br>Every touch is chaos. Survive longer.`;
    overlay.querySelector('#start').textContent = 'TRY AGAIN';
  }

  function burst(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 20 + Math.random() * 20,
        color,
        r: 1 + Math.random() * 2,
      });
    }
  }

  function chaosBounce() {
    // Completely re-roll velocity direction and speed — extremely hard to predict
    const speed = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
    // Angle: mostly upward bias but with brutal sideways and occasional near-horizontal
    const base = -Math.PI / 2; // up
    const angle = base + (Math.random() - 0.5) * ANGLE_SPREAD;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    // Randomize "height" impulse extra vertical snap sometimes
    if (Math.random() < 0.45) {
      ball.vy -= 3 + Math.random() * 10;
    }
    // Occasional vicious horizontal spike
    if (Math.random() < 0.35) {
      ball.vx += (Math.random() < 0.5 ? -1 : 1) * (6 + Math.random() * 12);
    }
    // Tiny radius jitter so timing feel shifts
    ball.r = BALL_R * (0.85 + Math.random() * 0.35);
    ball.hue = (ball.hue + 20 + Math.random() * 40) % 360;
    shake = 6 + Math.random() * 6;
  }

  function tryHit(px, py) {
    if (!running) return;
    const dx = px - ball.x;
    const dy = py - ball.y;
    const dist = Math.hypot(dx, dy);
    // Strict: must actually hit the circle
    if (dist <= ball.r * HIT_SHRINK) {
      score += 1;
      streak += 1;
      scoreEl.textContent = score;
      streakEl.textContent = streak;
      chaosBounce();
      burst(ball.x, ball.y, 14, `hsla(${ball.hue},80%,65%,0.9)`);
      if (score % 10 === 0) flash('STREAK ' + streak);
    } else {
      // Missed touch while ball is live = fail
      burst(px, py, 8, 'rgba(255,100,90,0.85)');
      fail('MISS TOUCH');
    }
  }

  function startGame() {
    score = 0;
    streak = 0;
    scoreEl.textContent = '0';
    streakEl.textContent = '0';
    particles = [];
    resetBall(true);
    running = true;
    overlay.classList.add('hidden');
    flash('KEEP IT UP');
  }

  document.getElementById('start').addEventListener('click', startGame);

  // Touch + mouse
  function pointerPos(e) {
    if (e.touches && e.touches[0]) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!running) return;
    const p = pointerPos(e);
    tryHit(p.x, p.y);
  }, { passive: false });

  canvas.addEventListener('mousedown', e => {
    if (!running) return;
    tryHit(e.clientX, e.clientY);
  });

  function update() {
    if (msgT > 0) {
      msgT--;
      if (msgT === 0) msgEl.classList.remove('show');
    }
    if (shake > 0) shake *= 0.85;
    if (!running) return;

    ball.vy += GRAVITY;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall bounces (slight energy keep — still chaotic)
    if (ball.x < ball.r) {
      ball.x = ball.r;
      ball.vx = Math.abs(ball.vx) * (0.7 + Math.random() * 0.5);
    } else if (ball.x > W - ball.r) {
      ball.x = W - ball.r;
      ball.vx = -Math.abs(ball.vx) * (0.7 + Math.random() * 0.5);
    }
    // Ceiling soft bounce
    if (ball.y < ball.r + 40) {
      ball.y = ball.r + 40;
      ball.vy = Math.abs(ball.vy) * 0.6;
    }

    const floor = H * FLOOR_RATIO;
    if (ball.y + ball.r >= floor) {
      fail('DROPPED');
      return;
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw() {
    const sx = (Math.random() - 0.5) * shake;
    const sy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(sx, sy);

    // Background
    const g = ctx.createRadialGradient(ball.x, ball.y, 10, ball.x, ball.y, Math.max(W, H) * 0.7);
    g.addColorStop(0, '#121722');
    g.addColorStop(1, '#07080c');
    ctx.fillStyle = g;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Floor line
    const floor = H * FLOOR_RATIO;
    ctx.strokeStyle = 'rgba(255,90,90,0.35)';
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(0, floor);
    ctx.lineTo(W, floor);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,80,80,0.06)';
    ctx.fillRect(0, floor, W, H - floor);

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 40);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (running || score > 0) {
      // Ball glow
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r * 1.6, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${ball.hue}, 90%, 55%, 0.12)`;
      ctx.fill();

      // Ball
      const bg = ctx.createRadialGradient(
        ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, 2,
        ball.x, ball.y, ball.r
      );
      bg.addColorStop(0, `hsla(${ball.hue}, 85%, 72%, 1)`);
      bg.addColorStop(1, `hsla(${ball.hue}, 80%, 42%, 1)`);
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.strokeStyle = `hsla(${ball.hue}, 90%, 80%, 0.7)`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  resetBall(true);
  loop();
})();
</script>
</body>
</html>
