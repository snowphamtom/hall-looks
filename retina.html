<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RETINA — see what your eye really captures</title>
<style>
  :root { --safe-b: env(safe-area-inset-bottom, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #toast {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 0; right: 0;
    text-align: center; color: #fff; font-size: 13px; letter-spacing: 0.35em;
    text-indent: 0.35em; opacity: 0; transition: opacity 0.45s; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  #gate {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: #000; color: #fff;
  }
  #gate .t { font-size: 22px; letter-spacing: 0.4em; text-indent: 0.4em; }
  #gate .s { font-size: 12px; letter-spacing: 0.2em; color: #888; }
  #gate .pulse { animation: pl 2.2s ease-in-out infinite; }
  @keyframes pl { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div id="gate"><div class="t pulse">TAP TO SEE</div><div class="s">what your eye really captures</div></div>
<script type="module">
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const toast = document.getElementById("toast"), gate = document.getElementById("gate");
const video = document.createElement("video");
video.playsInline = true; video.muted = true;

let CW = 0, CH = 0, PW = 0, PH = 0;
let ready = false, fi = 0;

/* offscreen canvases */
const pc = document.createElement("canvas"), pxx = pc.getContext("2d", { willReadFrequently: true });
const tA = document.createElement("canvas"), tAx = tA.getContext("2d");
const tB = document.createElement("canvas"), tBx = tB.getContext("2d", { willReadFrequently: true });
const mC = document.createElement("canvas"), mCx = mC.getContext("2d");
const sC = document.createElement("canvas"), sCx = sC.getContext("2d");

let outImg = null, lumA = null, acc = null;
let dxA = null, dyA = null, rA = null, aA = null, vigA = null;
let avgLum = 0.4;
const snow = [];
for (let i = 0; i < 46; i++) snow.push({ x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 1.6, v: 0.008 + Math.random() * 0.02 });

const SOL_LUT = [];
for (let i = 0; i < 256; i++) {
  const v = i / 255;
  SOL_LUT.push((v < 0.5 ? 2 * v : 2 * (1 - v)) * 255 | 0);
}
const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];

function sstep(e0, e1, x) {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}

function sizeAll() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  CW = cv.width = Math.max(1, Math.round(window.innerWidth * d));
  CH = cv.height = Math.max(1, Math.round(window.innerHeight * d));
  PH = 360; PW = Math.max(2, Math.round(PH * CW / CH));
  pc.width = PW; pc.height = PH;
  tB.width = PW; tB.height = PH;
  mC.width = PW; mC.height = PH;
  sC.width = PW; sC.height = PH;
  const tw = Math.max(8, PW >> 2), th = Math.max(8, PH >> 2);
  tA.width = tw; tA.height = th;
  outImg = pxx.createImageData(PW, PH);
  lumA = new Float32Array(PW * PH);
  acc = new Float32Array(PW * PH * 3);
  dxA = new Float32Array(PW * PH); dyA = new Float32Array(PW * PH);
  rA = new Float32Array(PW * PH); aA = new Float32Array(PW * PH);
  vigA = new Float32Array(PW * PH);
  const cx = PW / 2, cy = PH / 2, mR = Math.hypot(cx, cy);
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const i = y * PW + x, dx = x - cx, dy = y - cy;
    dxA[i] = dx; dyA[i] = dy;
    rA[i] = Math.hypot(dx, dy) / mR;
    aA[i] = Math.atan2(dy, dx);
    const vx = x / PW - 0.5, vy = y / PH - 0.5;
    vigA[i] = Math.max(0.2, 1 - (vx * vx + vy * vy) * 1.5);
  }
}
sizeAll();
window.addEventListener("resize", sizeAll);

function drawCover(c, vw, vh, W, H, flip) {
  const base = Math.max(W / vw, H / vh);
  const dw = vw * base, dh = vh * base, dx = (W - dw) / 2, dy = (H - dh) / 2;
  if (flip) { c.save(); c.translate(0, H); c.scale(1, -1); c.drawImage(video, dx, dy, dw, dh); c.restore(); }
  else c.drawImage(video, dx, dy, dw, dh);
}
function blurInto(vw, vh, flip) {
  const tw = tA.width, th = tA.height;
  drawCover(tAx, vw, vh, tw, th, flip);
  tBx.imageSmoothingEnabled = true;
  tBx.drawImage(tA, 0, 0, tw, th, 0, 0, PW, PH);
}
function sharpData(vw, vh, flip) {
  drawCover(pxx, vw, vh, PW, PH, flip);
  return pxx.getImageData(0, 0, PW, PH).data;
}

/* ---------------- the ten lenses ---------------- */

function f_retina(vw, vh) {
  const A = sharpData(vw, vh, true);
  blurInto(vw, vh, true);
  const B = tBx.getImageData(0, 0, PW, PH).data;
  const out = outImg.data, n = PW * PH;
  const bsx = PW * 0.66, bsy = PH * 0.5, bsr = Math.min(PW, PH) * 0.032;
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    const mix = sstep(0.20, 0.58, rA[i]);
    let r = A[o] * (1 - mix) + B[o] * mix;
    let g = A[o + 1] * (1 - mix) + B[o + 1] * mix;
    let b = A[o + 2] * (1 - mix) + B[o + 2] * mix;
    r = 255 - r; g = 255 - g; b = 255 - b;
    const x = i % PW, y = (i / PW) | 0;
    const bd = Math.hypot(x - bsx, y - bsy);
    if (bd < bsr) { const k = 0.12 + 0.88 * (bd / bsr); r *= k; g *= k; b *= k; }
    out[o] = r; out[o + 1] = g; out[o + 2] = b; out[o + 3] = 255;
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.drawImage(pc, 0, 0, CW, CH);
}

function f_prism(vw, vh, dt, tt) {
  const A = sharpData(vw, vh, false);
  const out = outImg.data, n = PW * PH;
  const cx = PW / 2, cy = PH / 2;
  const amt = 0.055 + 0.02 * Math.sin(tt * 0.6);
  for (let i = 0; i < n; i++) {
    const o = i * 4, r = rA[i];
    const k = amt * r * r;
    const sxr = Math.max(0, Math.min(PW - 1, Math.round(cx + dxA[i] * (1 + k))));
    const syr = Math.max(0, Math.min(PH - 1, Math.round(cy + dyA[i] * (1 + k))));
    const sxb = Math.max(0, Math.min(PW - 1, Math.round(cx + dxA[i] * (1 - k))));
    const syb = Math.max(0, Math.min(PH - 1, Math.round(cy + dyA[i] * (1 - k))));
    out[o] = A[(syr * PW + sxr) * 4];
    out[o + 1] = A[o + 1];
    out[o + 2] = A[(syb * PW + sxb) * 4 + 2];
    out[o + 3] = 255;
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.drawImage(pc, 0, 0, CW, CH);
}

function f_afterimage(vw, vh) {
  const A = sharpData(vw, vh, false);
  const out = outImg.data, n = PW * PH;
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    for (let c = 0; c < 3; c++) {
      const s = A[o + c] / 255;
      const a = Math.max(s * 0.5, acc[o + c] * 0.93);
      acc[o + c] = a;
      out[o + c] = Math.min(255, a * 1.5 * 255);
    }
    out[o + 3] = 255;
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.drawImage(pc, 0, 0, CW, CH);
}

function f_deepfield(vw, vh, dt, tt) {
  drawCover(pxx, vw, vh, PW, PH, false);
  blurInto(vw, vh, false);
  const fy = (0.55 + 0.13 * Math.sin(tt * 0.23)) * PH, fw = PH * 0.17;
  const mg = mCx.createLinearGradient(0, 0, 0, PH);
  mg.addColorStop(0, "rgba(0,0,0,0)");
  mg.addColorStop(Math.max(0, (fy - fw) / PH), "rgba(0,0,0,0)");
  mg.addColorStop(Math.min(1, Math.max(0, fy / PH)), "rgba(0,0,0,1)");
  mg.addColorStop(Math.min(1, (fy + fw) / PH), "rgba(0,0,0,0)");
  mg.addColorStop(1, "rgba(0,0,0,0)");
  mCx.globalCompositeOperation = "source-over";
  mCx.fillStyle = mg; mCx.fillRect(0, 0, PW, PH);
  sCx.globalCompositeOperation = "source-over";
  sCx.drawImage(pc, 0, 0);
  sCx.globalCompositeOperation = "destination-in";
  sCx.drawImage(mC, 0, 0);
  sCx.globalCompositeOperation = "source-over";
  ctx.drawImage(tB, 0, 0, CW, CH);
  ctx.drawImage(sC, 0, 0, CW, CH);
}

function f_solarize(vw, vh) {
  const A = sharpData(vw, vh, false);
  const out = outImg.data, n = PW * PH;
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    out[o] = SOL_LUT[A[o]]; out[o + 1] = SOL_LUT[A[o + 1]]; out[o + 2] = SOL_LUT[A[o + 2]];
    out[o + 3] = 255;
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.drawImage(pc, 0, 0, CW, CH);
}

function f_vortex(vw, vh, dt, tt) {
  const A = sharpData(vw, vh, false);
  const out = outImg.data, n = PW * PH;
  const cx = PW / 2, cy = PH / 2, mR = Math.hypot(cx, cy);
  const K = 0.55 + 0.25 * Math.sin(tt * 0.4);
  for (let i = 0; i < n; i++) {
    const o = i * 4, rr = rA[i] * mR;
    const aa = aA[i] + K * 900 / (rr + 40);
    const sx = Math.max(0, Math.min(PW - 1, Math.round(cx + rr * Math.cos(aa))));
    const sy = Math.max(0, Math.min(PH - 1, Math.round(cy + rr * Math.sin(aa))));
    const so = (sy * PW + sx) * 4;
    out[o] = A[so]; out[o + 1] = A[so + 1]; out[o + 2] = A[so + 2]; out[o + 3] = 255;
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.drawImage(pc, 0, 0, CW, CH);
}

function f_strata(vw, vh) {
  const A = sharpData(vw, vh, false);
  const out = outImg.data, n = PW * PH;
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const i = y * PW + x, o = i * 4;
    const xr = Math.min(PW - 1, x + 2), xb = Math.max(0, x - 2);
    const dth = (BAYER[(y & 3) * 4 + (x & 3)] - 7.5) / 16;
    let r = A[(y * PW + xr) * 4] / 255, g = A[o + 1] / 255, b = A[(y * PW + xb) * 4 + 2] / 255;
    r = Math.min(1, Math.max(0, (Math.floor(r * 4 + dth) / 3)));
    g = Math.min(1, Math.max(0, (Math.floor(g * 4 + dth) / 3)));
    b = Math.min(1, Math.max(0, (Math.floor(b * 4 + dth) / 3)));
    out[o] = r * 255; out[o + 1] = g * 255; out[o + 2] = b * 255; out[o + 3] = 255;
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.drawImage(pc, 0, 0, CW, CH);
}

function f_nocturne(vw, vh) {
  const A = sharpData(vw, vh, false);
  blurInto(vw, vh, false);
  const Bd = tBx.getImageData(0, 0, PW, PH).data;
  const out = outImg.data, n = PW * PH;
  let sum = 0;
  for (let i = 0; i < n; i += 4) sum += (A[i * 4] * 0.299 + A[i * 4 + 1] * 0.587 + A[i * 4 + 2] * 0.114) / 255;
  const frameAvg = sum / (n / 4);
  avgLum += (frameAvg - avgLum) * 0.06;
  const gain = Math.max(1, Math.min(6, 0.55 / (avgLum + 0.08)));
  for (let i = 0; i < n; i++) {
    const o = i * 4, y = (i / PW) | 0;
    const lum = (A[o] * 0.299 + A[o + 1] * 0.587 + A[o + 2] * 0.114) / 255;
    const blum = (Bd[o] * 0.299 + Bd[o + 1] * 0.587 + Bd[o + 2] * 0.114) / 255;
    const halo = Math.max(0, blum - 0.55) * 1.6;
    let g = Math.min(1, lum * gain + halo) * vigA[i];
    const gr = (Math.random() - 0.5) * 30;
    g = Math.max(0, Math.min(1, g + gr / 255));
    const scan = (y % 3 === 0) ? 0.74 : 1;
    out[o] = g * 70 * scan; out[o + 1] = g * 255 * scan; out[o + 2] = g * 80 * scan; out[o + 3] = 255;
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.drawImage(pc, 0, 0, CW, CH);
}

function f_aqua(vw, vh, dt, tt) {
  const A = sharpData(vw, vh, false);
  const out = outImg.data, n = PW * PH;
  const cx = PW / 2, cy = PH / 2;
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const i = y * PW + x, o = i * 4;
    const u = Math.sin(x * 0.09 + tt * 0.8) + Math.sin(y * 0.11 - tt * 0.6)
            + Math.sin((x + y) * 0.05 + tt * 0.4) + Math.sin(Math.hypot(x - cx, y - cy) * 0.12 - tt);
    const ca = Math.pow(Math.max(0, 1 - Math.abs(u) * 0.45), 6);
    let r = A[o] * 0.52, g = A[o + 1] * 0.82 + ca * 130, b = A[o + 2] * 1.02 + ca * 150;
    const dxr = x / PW - 0.72;
    const ray = Math.exp(-dxr * dxr * 60) * (0.5 + 0.5 * Math.sin(tt * 0.7 + y * 0.03));
    r += ray * 36; g += ray * 44; b += ray * 40;
    out[o] = Math.min(255, r); out[o + 1] = Math.min(255, g); out[o + 2] = Math.min(255, b); out[o + 3] = 255;
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.fillStyle = "#cfe8ff";
  for (const p of snow) {
    p.y += p.v * dt * 3;
    if (p.y > 1.05) { p.y = -0.05; p.x = Math.random(); }
    ctx.globalAlpha = 0.5;
    ctx.fillRect(p.x * PW, p.y * PH, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.drawImage(pc, 0, 0, CW, CH);
}

function f_eventhorizon(vw, vh, dt, tt) {
  const A = sharpData(vw, vh, false);
  const out = outImg.data, n = PW * PH;
  const cx = PW / 2, cy = PH / 2, mR = Math.hypot(cx, cy);
  const Rs = Math.min(PW, PH) * 0.155 * (1 + 0.05 * Math.sin(tt * 0.8));
  const ringR = Rs * 1.6, ringW = Rs * 0.14, alp2 = Rs * Rs * 1.1;
  const flick = 1 + 0.18 * Math.sin(tt * 3.1) + 0.08 * Math.sin(tt * 7.7);
  for (let i = 0; i < n; i++) {
    const o = i * 4, rr = rA[i] * mR;
    if (rr < Rs * 0.88) {
      const rim = sstep(Rs * 0.7, Rs * 0.88, rr);
      out[o] = 40 * rim; out[o + 1] = 8 * rim; out[o + 2] = 12 * rim; out[o + 3] = 255;
    } else {
      const rD = rr + alp2 / (rr + 8);
      const aa = aA[i] + 1100 / (rr + 50) + tt * 0.12;
      const sx = Math.max(0, Math.min(PW - 1, Math.round(cx + rD * Math.cos(aa))));
      const sy = Math.max(0, Math.min(PH - 1, Math.round(cy + rD * Math.sin(aa))));
      const so = (sy * PW + sx) * 4;
      const dr = (rr - ringR) / ringW;
      const ring = Math.exp(-dr * dr * 0.5) * flick;
      out[o] = Math.min(255, A[so] * (1 + ring * 0.25) + ring * 200);
      out[o + 1] = Math.min(255, A[so + 1] * (1 + ring * 0.25) + ring * 120);
      out[o + 2] = Math.min(255, A[so + 2] * (1 + ring * 0.25) + ring * 50);
      out[o + 3] = 255;
    }
  }
  pxx.putImageData(outImg, 0, 0);
  ctx.drawImage(pc, 0, 0, CW, CH);
}

const FILTERS = [
  { name: "RETINA", fn: f_retina },
  { name: "PRISM", fn: f_prism },
  { name: "AFTERIMAGE", fn: f_afterimage },
  { name: "DEEP FIELD", fn: f_deepfield },
  { name: "SOLARIZE", fn: f_solarize },
  { name: "VORTEX", fn: f_vortex },
  { name: "STRATA", fn: f_strata },
  { name: "NOCTURNE", fn: f_nocturne },
  { name: "AQUA", fn: f_aqua },
  { name: "EVENT HORIZON", fn: f_eventhorizon },
];

function resetFilter() {
  acc.fill(0);
  avgLum = 0.4;
}

let toastTimer = 0;
function showToast(t) {
  toast.textContent = t;
  toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = 0; }, 1600);
}

async function initCamera() {
  const q = { video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
  let s;
  try { s = await navigator.mediaDevices.getUserMedia(q); }
  catch (e) {
    q.video.facingMode = "user";
    s = await navigator.mediaDevices.getUserMedia(q);
  }
  video.srcObject = s;
  await video.play();
}

gate.addEventListener("pointerdown", async (e) => {
  e.preventDefault();
  gate.querySelector(".t").textContent = "OPENING…";
  try {
    await initCamera();
    ready = true;
    gate.style.display = "none";
    showToast(FILTERS[0].name);
  } catch (e) {
    gate.querySelector(".t").textContent = "CAMERA BLOCKED";
    gate.querySelector(".s").textContent = "allow camera access, then reload";
  }
});

window.addEventListener("pointerdown", (e) => {
  if (!ready || e.target.closest("#gate")) return;
  fi = (fi + 1) % FILTERS.length;
  resetFilter();
  showToast(FILTERS[fi].name);
});

let lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (!ready) return;
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  FILTERS[fi].fn(vw, vh, dt, t / 1000);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
