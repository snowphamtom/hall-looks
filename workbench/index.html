<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEAVY IS THE CROWN — Workbench</title>
<meta name="description" content="Customize your character from blueprint to hyper-real.">
<meta name="theme-color" content="#070708">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbench">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--bg:#070708;--panel:#0e1013;--line:rgba(140,210,255,.13);--txt:#e9eff5;--dim:#8b95a2;--accent:#8cd2ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
header h1{font-size:14px;letter-spacing:4px;font-weight:800}
header a{color:var(--dim);text-decoration:none;font-size:12px;letter-spacing:1px}
#wbReadout{font-family:ui-monospace,monospace;font-size:11px;color:var(--accent);letter-spacing:2px}
main{flex:1;display:grid;grid-template-columns:230px 1fr 250px;min-height:0}
aside{background:var(--panel);padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
aside h2{font-size:10px;letter-spacing:2px;color:var(--dim);margin:0 0 12px;font-weight:700}
.chassis{display:grid;gap:10px}
.chassis button{background:#0a0d12;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;color:var(--txt);transition:border-color .2s,transform .15s;width:100%}
.chassis button:active{transform:scale(.97)}
.chassis button.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chassis button img{width:100%;height:110px;object-fit:contain;display:block}
.chassis button span{font-size:9px;letter-spacing:1px;display:block;margin-top:6px;color:var(--dim)}
.chassis button.active span{color:var(--txt)}
.mat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.mat-grid button{border:1px solid var(--line);background:#0a0d12;border-radius:12px;padding:10px 4px;cursor:pointer;color:var(--txt);font-size:9px;letter-spacing:.5px;font-family:inherit}
.mat-grid button.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mat-grid button i{display:block;width:24px;height:24px;border-radius:50%;margin:0 auto 6px;border:1px solid rgba(255,255,255,.2)}
.ctrl{margin-bottom:16px}
.ctrl label{font-size:10px;letter-spacing:1px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:8px}
.ctrl label b{color:var(--txt)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.stage{position:relative;display:flex;flex-direction:column;min-height:0;background:#050507;min-width:0}
.canvas-stack{position:relative;flex:1;min-height:320px}
.canvas-stack canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .08s linear}
#wbHyperreal{opacity:0}
.materialize{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);flex:none}
.materialize .row{display:flex;align-items:center;gap:12px}
.materialize .row span{font-size:9px;letter-spacing:2px;color:var(--dim);white-space:nowrap}
.materialize .row span:last-child{color:var(--accent)}
#matSlider{flex:1;accent-color:var(--accent);height:32px}
.export-row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;background:var(--accent);color:#04121f;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:13px;letter-spacing:1px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
/* cinematic generate overlay */
#genOverlay{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(5,5,7,.55);backdrop-filter:blur(2px)}
#genOverlay.on{display:flex}
#genOverlay .scan{width:70%;height:2px;background:var(--accent);box-shadow:0 0 18px var(--accent);animation:scan 1.1s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-70px);opacity:0}15%,85%{opacity:1}50%{transform:translateY(70px)}}
#genOverlay p{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--accent)}
@media(max-width:920px){
main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
aside.left{border-right:none;border-bottom:1px solid var(--line);max-height:172px}
aside.right{border-left:none;border-top:1px solid var(--line)}
.chassis{grid-template-columns:repeat(6,110px);grid-auto-flow:column;overflow-x:auto;padding-bottom:6px}
.chassis button img{height:74px}
.canvas-stack{min-height:46vh}
}
</style>
</head>
<body>
<header>
<h1>WORKBENCH</h1>
<div id="wbReadout">BLUEPRINT — 0%</div>
<a href="../">← HALL</a>
</header>
<main>
<aside class="left">
<h2>CHASSIS</h2>
<div class="chassis" id="chassisPick">
<button data-c="vx19" class="active"><img alt="VX-19 Dominus"><span>VX-19 DOMINUS</span></button>
<button data-c="wraith"><img alt="Wraith"><span>WRAITH</span></button>
<button data-c="ronin"><img alt="Ronin"><span>RONIN</span></button>
<button data-c="chrome"><img alt="Chrome"><span>CHROME</span></button>
<button data-c="hooded"><img alt="Hooded Assassin"><span>HOODED</span></button>
<button data-c="vx19w"><img alt="VX-19 Ghost"><span>VX-19 GHOST</span></button>
</div>
</aside>
<div class="stage">
<div class="canvas-stack" id="stack">
<canvas id="wbBlueprint"></canvas>
<canvas id="wbHyperreal"></canvas>
<div id="genOverlay"><div class="scan"></div><p>MATERIALIZING</p></div>
</div>
<div class="materialize">
<div class="row">
<span>BLUEPRINT</span>
<input type="range" id="matSlider" min="0" max="100" value="0">
<span>HYPER-REAL</span>
</div>
<div class="export-row">
<button class="btn" id="exportBtn">GENERATE IMAGE</button>
<button class="btn ghost" id="resetBtn">RESET</button>
</div>
</div>
</div>
<aside class="right">
<h2>MATERIAL</h2>
<div class="mat-grid" id="matPick">
<button data-m="onyx" class="active"><i style="background:linear-gradient(135deg,#151515,#d4a843)"></i>ONYX GOLD</button>
<button data-m="carbon"><i style="background:linear-gradient(135deg,#1c1c1e,#5a5a5e)"></i>CARBON</button>
<button data-m="steel"><i style="background:linear-gradient(135deg,#4a5a6a,#c8d8e8)"></i>STEEL</button>
<button data-m="ghost"><i style="background:linear-gradient(135deg,#b8e8dc,#ffffff)"></i>GHOST</button>
<button data-m="ember"><i style="background:linear-gradient(135deg,#2a0f08,#ff783c)"></i>EMBER</button>
<button data-m="frost"><i style="background:linear-gradient(135deg,#0a2a3a,#78dcff)"></i>FROST</button>
</div>
<h2>DETAIL</h2>
<div class="ctrl"><label>EDGE DEFINITION <b id="vDetail">70%</b></label>
<input type="range" id="rDetail" min="0" max="100" value="70"></div>
<div class="ctrl"><label>SURFACE POLISH <b id="vPolish">60%</b></label>
<input type="range" id="rPolish" min="0" max="100" value="60"></div>
<div class="ctrl"><label>RIM GLOW <b id="vGlow">40%</b></label>
<input type="range" id="rGlow" min="0" max="100" value="40"></div>
</aside>
</main>
<script src="chassis-vx19.js?v=fbbcb7a4"></script>
<script src="chassis-hooded.js?v=571439b4"></script>
<script src="chassis-vx19w.js?v=d1b6fd7c"></script>
<script src="chassis-wraith.js?v=5776c9a8"></script>
<script src="chassis-ronin.js?v=98be993c"></script>
<script src="chassis-chrome.js?v=da80a0c3"></script>
<script src="workbench.js?v=ca48f429"></script>
<script>
document.querySelectorAll('#chassisPick button').forEach(function (b) {
  var k = b.dataset.c;
  b.querySelector('img').src = (window.WB_CHASSIS || {})[k] || '';
  b.addEventListener('click', function () {
    document.querySelectorAll('#chassisPick button').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    WB.set('chassis', k);
  });
});
document.querySelectorAll('#matPick button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('#matPick button').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    WB.set('material', b.dataset.m);
  });
});
function bindRange(id, key, label) {
  var r = document.getElementById(id);
  r.addEventListener('input', function () {
    document.getElementById(label).textContent = r.value + '%';
    WB.set(key, r.value / 100);
  });
}
bindRange('rDetail', 'detail', 'vDetail');
bindRange('rPolish', 'polish', 'vPolish');
bindRange('rGlow', 'glow', 'vGlow');
// smooth slider: animate toward target for cinematic feel
var sliderTarget = 0, sliderAnim = null;
document.getElementById('matSlider').addEventListener('input', function (e) {
  sliderTarget = e.target.value / 100;
  if (!sliderAnim) {
    (function tick() {
      var cur = WB.state.materialize;
      var d = sliderTarget - cur;
      if (Math.abs(d) < 0.004) { WB.set('materialize', sliderTarget); sliderAnim = null; return; }
      WB.set('materialize', cur + d * 0.22);
      sliderAnim = requestAnimationFrame(tick);
    })();
  }
});
document.getElementById('exportBtn').addEventListener('click', function () {
  var ov = document.getElementById('genOverlay');
  ov.classList.add('on');
  var prev = WB.state.materialize;
  WB.set('materialize', 1);
  setTimeout(function () {
    WB.export();
    ov.classList.remove('on');
    WB.set('materialize', prev);
    document.getElementById('matSlider').value = Math.round(prev * 100);
  }, 1300);
});
document.getElementById('resetBtn').addEventListener('click', function () {
  sliderTarget = 0;
  WB.set('materialize', 0);
  document.getElementById('matSlider').value = 0;
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
