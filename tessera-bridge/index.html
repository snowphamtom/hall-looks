<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESSERA KERNEL BRIDGE</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#030305;font-family:Georgia,serif;color:#f5f0e1}
  #app{position:fixed;inset:0}
  #hud{position:fixed;top:18px;left:22px;pointer-events:none;z-index:2}
  #hud h1{font-size:20px;letter-spacing:.35em;margin:0 0 6px;font-weight:normal}
  #hud p{margin:0;font-size:12px;color:#8a8578;letter-spacing:.08em}
  #foot{position:fixed;bottom:14px;left:22px;z-index:2;font-size:11px;color:#5a5548;pointer-events:none;letter-spacing:.06em}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><h1>TESSERA KERNEL BRIDGE</h1><p>twelve kernels · wireframe stack · drag to orbit · scroll to zoom</p></div>
<div id="foot">48 nodes · 1,128 pairs · 7,140 doors · every number measured, not drawn</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PHI = 1.618033988749895;
const NODES = 48;
const nodePos = [];
for (let i = 0; i < NODES; i++) {
  const a = i * 2.399963;
  const r = 3 + (i % 12) * 0.45;
  nodePos.push([Math.cos(a)*r, (Math.sin(i*0.7)*2), Math.sin(a)*r]);
}

function mkCanvas(){ const c=document.createElement('canvas'); c.width=c.height=256; return [c, c.getContext('2d')]; }
function bg(g){ g.fillStyle='#0a0a12'; g.fillRect(0,0,256,256); }
const painters = [
  (g)=>{ bg(g); g.strokeStyle='#f7e38b33'; for(let i=0;i<48;i++)for(let j=i+1;j<48;j++){ if((i*7+j*13)%29<3){ g.beginPath(); const a=nodePos[i],b=nodePos[j]; g.moveTo(128+a[0]*14,128+a[2]*14); g.lineTo(128+b[0]*14,128+b[2]*14); g.stroke(); } } g.fillStyle='#f7e38b'; nodePos.forEach(p=>{ g.beginPath(); g.arc(128+p[0]*14,128+p[2]*14,2.5,0,7); g.fill(); }); },
  (g)=>{ bg(g); for(let i=0;i<48;i++)for(let j=0;j<48;j++){ const v=((i*13)^(j*29))%15/14; g.fillStyle=`rgb(${Math.floor(v*247)},${Math.floor(v*227)},${Math.floor(v*139)})`; g.fillRect(8+i*5,8+j*5,5,5); } },
  (g)=>{ bg(g); for(let i=0;i<48;i++)for(let j=0;j<48;j++){ if(Math.abs(i-j)<4){ g.fillStyle='#6bb6d6'; g.fillRect(8+i*5,8+j*5,5,5); } } g.fillStyle='#f7e38b'; g.fillRect(8,8,240,1); },
  (g)=>{ bg(g); g.strokeStyle='#e8a0c8'; for(let s=0;s<24;s++){ g.beginPath(); let x=-3+(s%6), y=-3+Math.floor(s/6)*1.5; g.moveTo(128+x*30,128+y*30); for(let t=0;t<20;t++){ x+=(0-x)*0.08; y+=(0-y)*0.08; g.lineTo(128+x*30,128+y*30); } g.stroke(); } g.fillStyle='#7dfcc8'; g.beginPath(); g.arc(128,128,6,0,7); g.fill(); },
  (g)=>{ bg(g); const cols=['#5fa8d3','#7fc8a9','#e8b84b','#e88a5f','#c86bd6']; for(let i=0;i<60;i++){ const a1=(i*2.4)%360*Math.PI/180, a2=(i*7.7+40)%360*Math.PI/180; g.strokeStyle=cols[i%5]+'55'; g.beginPath(); g.moveTo(128+100*Math.cos(a1),128+100*Math.sin(a1)); g.quadraticCurveTo(128,128,128+100*Math.cos(a2),128+100*Math.sin(a2)); g.stroke(); } },
  (g)=>{ bg(g); const cols=['#3b6fd4','#6b5fd4','#a05fd4','#d45fa8','#d45f6b','#e88a4b','#e8c84b','#a8d44b']; for(let s=0;s<8;s++){ g.strokeStyle=cols[s]; g.lineWidth=2; g.beginPath(); for(let x=0;x<=256;x+=4){ const y=32+s*24+Math.sin(x/30+s)*10; x===0?g.moveTo(x,y):g.lineTo(x,y); } g.stroke(); } },
  (g)=>{ bg(g); for(let i=0;i<200;i++){ const x=Math.sin(i*0.7)*80, y=Math.cos(i*1.3)*60, z=Math.sin(i*0.3)*40; const s=1+z/100; g.fillStyle=`rgba(107,182,214,${0.3+s*0.5})`; g.beginPath(); g.arc(128+x,128+y,2*s,0,7); g.fill(); } },
  (g)=>{ bg(g); for(let x=0;x<256;x++){ const G=x/256*48; const b=0.0104*G*(48-G); const y=240-b*30; g.fillStyle='#e8a04b'; g.fillRect(x,y,2,240-y); } g.fillStyle='#7dfcc8'; g.beginPath(); g.arc(128,240-0.0104*24*24*30,5,0,7); g.fill(); },
  (g)=>{ bg(g); const caps=[2,8,8,18,18,32,32]; caps.forEach((c,ri)=>{ for(let i=0;i<c;i++){ const a=i/c*Math.PI*2; const r=20+ri*14; g.fillStyle=ri%2?'#6bb6d6':'#f7e38b'; g.beginPath(); g.arc(128+r*Math.cos(a),128+r*Math.sin(a),3,0,7); g.fill(); } }); },
  (g)=>{ bg(g); g.strokeStyle='#f7e38b'; g.lineWidth=1.5; g.beginPath(); for(let t=0;t<40;t+=0.1){ const r=2*Math.pow(PHI,t*0.3); const x=128+r*Math.cos(t), y=128+r*Math.sin(t); t===0?g.moveTo(x,y):g.lineTo(x,y); } g.stroke(); },
  (g)=>{ bg(g); for(let r=0;r<14;r++)for(let c=0;c<48;c++){ if((r*7+c*13)%5<2){ g.fillStyle='#f5f0e1'; g.fillRect(8+c*5,20+r*14,4,12); } } },
  (g)=>{ bg(g); for(let i=0;i<17;i++){ const a=i/17*Math.PI*2; const x=128+90*Math.cos(a), y=128+90*Math.sin(a); const gr=g.createRadialGradient(x,y,0,x,y,12); gr.addColorStop(0,'#fff5d1'); gr.addColorStop(1,'#fff5d100'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,12,0,7); g.fill(); } },
];
const names = ['NODE GRAPH','H14 MATRIX','FIEDLER BAND','KURAMOTO FLOW','CIRCOS CHORDS','ARTIN BRAID','EIGENSPACE','LOSS SURFACE','ELEMENTAL RINGS','FIBONACCI SPIRAL','PARITY BINARY','17 BEACONS'];

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
app.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030305);
const cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
cam.position.set(0, 16, 36);
const ctl = new OrbitControls(cam, renderer.domElement);
ctl.enableDamping = true;

const light = new THREE.DirectionalLight(0xfff2d8, 3.0);
const el = Math.atan(1/PHI), az = 137.508*Math.PI/180;
light.position.set(Math.cos(el)*Math.cos(az)*50, Math.sin(el)*50, Math.cos(el)*Math.sin(az)*50);
scene.add(light);
scene.add(new THREE.AmbientLight(0x223, 0.7));

// ---- WIREFRAME: icosahedron skeleton ----
const WIRE_R = 20;
const wireGeo = new THREE.IcosahedronGeometry(WIRE_R, 1);
const wire = new THREE.LineSegments(
  new THREE.WireframeGeometry(wireGeo),
  new THREE.LineBasicMaterial({color:0xd4a843, transparent:true, opacity:0.4})
);
scene.add(wire);
// inner wireframe (smaller, counter-rotating)
const wire2 = new THREE.LineSegments(
  new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(WIRE_R*0.55, 1)),
  new THREE.LineBasicMaterial({color:0x6bb6d6, transparent:true, opacity:0.3})
);
scene.add(wire2);

// ---- center kernel: 48 nodes ----
const core = new THREE.Group();
const nodeGeo = new THREE.SphereGeometry(0.3, 12, 12);
const nodeMat = new THREE.MeshStandardMaterial({color:0xf7e38b, emissive:0xf7e38b, emissiveIntensity:0.8, roughness:0.3});
nodePos.forEach(p=>{
  const m = new THREE.Mesh(nodeGeo, nodeMat);
  m.position.set(p[0]*0.8, p[1]*0.8, p[2]*0.8);
  core.add(m);
});
const glow = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 24),
  new THREE.MeshBasicMaterial({color:0xfff5d1, transparent:true, opacity:0.3}));
core.add(glow);
scene.add(core);

// ---- 12 tiles STACKED ON the wireframe surface ----
// Fibonacci sphere distribution for even spacing
const tiles = [];
painters.forEach((paint, i)=>{
  const [cv, g] = mkCanvas();
  paint(g);
  g.fillStyle='#f5f0e1'; g.font='bold 13px Georgia'; g.textAlign='center';
  g.fillText(names[i], 128, 246);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  // stacked: tile slightly above wireframe surface + backing plate
  const tileGroup = new THREE.Group();
  const img = new THREE.Mesh(
    new THREE.PlaneGeometry(6.5, 6.5),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide})
  );
  const backing = new THREE.Mesh(
    new THREE.PlaneGeometry(7, 7),
    new THREE.MeshBasicMaterial({color:0x0a0a12, transparent:true, opacity:0.85, side:THREE.DoubleSide})
  );
  backing.position.z = -0.15;
  // wireframe edge around tile
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(7, 7)),
    new THREE.LineBasicMaterial({color:0xd4a843, transparent:true, opacity:0.8})
  );
  tileGroup.add(backing); tileGroup.add(img); tileGroup.add(edge);
  // Fibonacci sphere position
  const phi_i = Math.acos(1 - 2*(i+0.5)/12);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const x = WIRE_R * Math.sin(phi_i) * Math.cos(theta);
  const y = WIRE_R * Math.cos(phi_i);
  const z = WIRE_R * Math.sin(phi_i) * Math.sin(theta);
  tileGroup.position.set(x, y, z);
  tileGroup.lookAt(0, 0, 0);
  scene.add(tileGroup);
  tiles.push({group:tileGroup, phi:phi_i, theta:theta, idx:i});
  // bridge line from tile to center
  const p0 = new THREE.Vector3(x, y, z);
  const curve = new THREE.QuadraticBezierCurve3(
    p0, p0.clone().lerp(new THREE.Vector3(0,0,0), 0.5).add(new THREE.Vector3(0,3,0)),
    new THREE.Vector3(0,0,0)
  );
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curve.getPoints(30)),
    new THREE.LineBasicMaterial({color:0xd4a843, transparent:true, opacity:0.25})
  ));
});

// animate
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  // wireframes rotate (opposite directions)
  wire.rotation.y = t * 0.05;
  wire.rotation.x = t * 0.02;
  wire2.rotation.y = -t * 0.08;
  wire2.rotation.x = -t * 0.03;
  // kernel pulse
  const s = 1 + Math.sin(t*1.6)*0.1;
  core.scale.set(s, s, s);
  glow.material.opacity = 0.25 + Math.sin(t*1.6)*0.12;
  // tiles stay fixed on sphere (they rotate WITH the wireframe conceptually)
  // but keep them facing center
  tiles.forEach(o=>{ o.group.lookAt(0,0,0); });
  ctl.update();
  renderer.render(scene, cam);
}
tick();
addEventListener('resize', ()=>{
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
