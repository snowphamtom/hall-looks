<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.05  0 0 0 0 0.04  0 0 0 1.8 -0.5"/>
  </filter>
  <filter id="lenticels" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.42" numOctaves="2" seed="21" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.34  0 0 0 0 0.27  0 0 0 7 -5.2"/>
  </filter>
  <filter id="sheen" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.03" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.20  0 0 0 0 0.16  0 0 0 1.8 -1.1"/>
  </filter>
  <rect width="640" height="160" fill="#3a1d18"/>
  <rect width="640" height="160" filter="url(#sheen)"/>
  <rect width="640" height="160" filter="url(#grain)"/>
  <rect width="640" height="160" filter="url(#lenticels)" opacity=".7"/>
</svg>
