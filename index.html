<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEAVY IS THE CROWN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@360;500;650&display=swap" rel="stylesheet">
<style>
:root { --bg:#07080c; --ink:#f4efe6; --line:rgba(244,239,230,.18); --amber:#e0a23a; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); font-family:Outfit,system-ui,sans-serif; }
nav { display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center; padding:18px 28px; letter-spacing:.14em; text-transform:uppercase; font-size:12px; }
nav a { color:var(--ink); text-decoration:none; opacity:.72; }
nav a[aria-current], nav a:hover { opacity:1; }
.brand { font-family:"Cormorant Garamond",serif; letter-spacing:.22em; font-size:14px; opacity:1; }
main { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr); gap:28px; padding:8px 28px 48px; }
.stage { position:relative; min-height:70vh; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:radial-gradient(circle at 50% 20%, #162033, #07080c 70%); }
.stage img { width:100%; height:100%; object-fit:contain; display:block; transform-origin:50% 80%; }
.veil { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; }
.side { border:1px solid var(--line); border-radius:18px; padding:22px; }
h1 { font-family:"Cormorant Garamond",serif; font-weight:500; font-size:52px; line-height:.9; margin:8px 0 16px; }
.kicker { letter-spacing:.18em; text-transform:uppercase; font-size:12px; opacity:.6; }
.looks { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 18px; }
button { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:8px 12px; cursor:pointer; font:inherit; }
button.on { border-color:var(--amber); color:var(--amber); }
label { display:block; margin:14px 0; font-size:14px; }
.hint { display:block; opacity:.55; font-size:12px; margin-top:2px; }
input[type=range] { width:100%; accent-color:var(--amber); }
.meta { font-variant-numeric:tabular-nums; opacity:.7; float:right; }
.note { opacity:.75; line-height:1.45; }
@media (max-width:860px) { main { grid-template-columns:1fr; } h1 { font-size:40px; } }
</style>
</head>
<body>
<nav>
  <a class="brand" href="#room">HEAVY IS THE CROWN</a>
  <a aria-current="page" href="#room">Room</a>
  <a href="#looks">Looks</a>
  <a href="#locker">Locker</a>
</nav>
<main id="room">
  <section class="stage" id="stage">
    <img id="figure" alt="Black Chrome, mirror black and an amber core." src="images/look-black-chrome-realistic.png">
    <div class="veil" id="veil"></div>
  </section>
  <aside class="side">
    <div class="kicker">The room</div>
    <h1>Heavy is the crown</h1>
    <p class="note">The weight sits. A control changes this figure. A look chip swaps that look's picture.</p>
    <div class="looks" id="looks">
      <button type="button" data-look="foundation">Foundation</button>
      <button type="button" class="on" data-look="black-chrome">Black Chrome</button>
      <button type="button" data-look="white-samurai">White Samurai</button>
      <button type="button" data-look="skull-champion">Skull Champion</button>
      <button type="button" data-look="titan-gladiator">Titan Gladiator</button>
    </div>
    <label>Length <span class="meta" id="lenV">50</span>
      <span class="hint">Scales the figure. It does not change the weapon.</span>
      <input id="length" type="range" min="0" max="100" value="50">
    </label>
    <label>Battle Damage <span class="meta" id="damV">0</span>
      <span class="hint">Raises contrast and lowers color. It does not draw a new scar.</span>
      <input id="damage" type="range" min="0" max="100" value="0">
    </label>
    <label>Energy Glow <span class="meta" id="glowV">0</span>
      <span class="hint">Lays an amber veil on the figure.</span>
      <input id="glow" type="range" min="0" max="100" value="0">
    </label>
    <p class="note" id="caption">Black Chrome. Mirror black, amber core.</p>
    <p class="note" id="locker">Locker 0 saved. Capacity: 24. Session only. Clears when this tab closes. Prism is rank 24.</p>
    <button type="button" id="save">Save this look</button>
  </aside>
</main>
<script>
const looks = {
  foundation: { src:"images/foundation.jpg", alt:"Foundation, iridescent armor and a clear cape.", line:"Foundation. Mirror black, pale crackle, holographic edge. Top rank." },
  "black-chrome": { src:"images/look-black-chrome-realistic.png", alt:"Black Chrome, mirror black and an amber core.", line:"Black Chrome. Mirror black, amber core." },
  "white-samurai": { src:"images/look-white-samurai-realistic.png", alt:"White Samurai, crackle ceramic called BeO, one katana.", line:"White Samurai. Crackle ceramic called BeO, one katana." },
  "skull-champion": { src:"images/look-skull-champion-realistic.png", alt:"Skull Champion, a skull helmet and a tactical axe.", line:"Skull Champion. A skull helmet and a tactical axe." },
  "titan-gladiator": { src:"images/look-titan-gladiator-realistic.png", alt:"Titan Gladiator, gunmetal called Ti-6Al-4V, a glow called Halbach.", line:"Titan Gladiator. Gunmetal called Ti-6Al-4V, a glow called Halbach." }
};
const KEY = "hitc-looks";
function loadSaved() {
  try { return JSON.parse(sessionStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
}
const state = { look:"black-chrome", length:50, battleDamage:0, energyGlow:0, saved:loadSaved() };
let raf = 0;
function schedule() {
  if (document.hidden) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => { raf = 0; try { draw(state); } catch (e) { console.warn(e); } });
}
document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } });
function draw(s) {
  const fig = document.getElementById("figure");
  const look = looks[s.look];
  if (fig.getAttribute("src") !== look.src) { fig.src = look.src; fig.alt = look.alt; }
  fig.style.transform = "scale(" + (0.86 + (s.length / 100) * 0.28) + ")";
  fig.style.filter = "contrast(" + (1 + s.battleDamage / 180) + ") saturate(" + (1 - s.battleDamage / 220) + ")";
  document.getElementById("veil").style.background = "radial-gradient(circle at 50% 42%, rgba(224,162,58," + (s.energyGlow / 180) + "), transparent 46%)";
  document.getElementById("lenV").textContent = s.length;
  document.getElementById("damV").textContent = s.battleDamage;
  document.getElementById("glowV").textContent = s.energyGlow;
  document.getElementById("caption").textContent = look.line;
  document.getElementById("locker").textContent = "Locker " + s.saved.length + " saved. Capacity: 24. Session only. Clears when this tab closes. Prism is rank 24.";
  document.getElementById("save").textContent = s.saved.includes(s.look) ? "Saved" : "Save this look";
}
document.getElementById("looks").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  state.look = b.dataset.look;
  document.querySelectorAll("#looks button").forEach((n) => n.classList.toggle("on", n === b));
  schedule();
});
document.getElementById("length").addEventListener("input", (e) => { state.length = Number(e.target.value); schedule(); });
document.getElementById("damage").addEventListener("input", (e) => { state.battleDamage = Number(e.target.value); schedule(); });
document.getElementById("glow").addEventListener("input", (e) => { state.energyGlow = Number(e.target.value); schedule(); });
document.getElementById("save").addEventListener("click", () => {
  if (state.saved.includes(state.look) || state.saved.length >= 24) return;
  state.saved.push(state.look);
  sessionStorage.setItem(KEY, JSON.stringify(state.saved));
  schedule();
});
schedule();
</script>
</body>
</html>
