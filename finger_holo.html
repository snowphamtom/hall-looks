<script>
const MASKS = [];
for (let m = 3; m <= 97; m += 2) MASKS.push(m);
const MSET = new Set(MASKS);
const bits = n => { let c = 0; while (n) { c += n & 1; n >>= 1; } return c; };
const ham = (a, b) => bits(a ^ b);
const doorsByPair = new Map();
let doorTotal = 0;
for (let i = 0; i < 48; i++) {
  for (let j = i + 1; j < 48; j++) {
    const a = MASKS[i], b = MASKS[j], xab = a ^ b, wa = bits(a), wb = bits(b);
    const found = [];
    for (let k = 0; k < 48; k++) {
      if (k === i || k === j) continue;
      const c = MASKS[k];
      const d = a + b - c;
      if (!MSET.has(d) || d === a || d === b || d === c) continue;
      if (wa + wb - bits(c) !== bits(d)) continue;
      if (xab !== (c ^ d)) continue;
      found.push([a, b, c, d]);
    }
    if (found.length) {
      doorsByPair.set(a + "," + b, found);
      doorTotal += found.length;
    }
  }
}
const pairs = [];
for (let i = 0; i < 48; i++) {
  for (let j = i + 1; j < 48; j++) {
    const a = MASKS[i], b = MASKS[j], key = a + "," + b;
    const dist = ham(a, b);
    const n = doorsByPair.has(key) ? doorsByPair.get(key).length : 0;
    const klass = dist === 1 ? "alias" : n ? "door" : "never";
    pairs.push({ a, b, dist, n, klass, comp: a + b === 128 });
  }
}
const tally = { door: 0, alias: 0, never: 0, comp: 0 };
pairs.forEach(p => { tally[p.klass]++; if (p.comp) tally.comp++; });
const ok = MASKS.length === 48 && pairs.length === 1128 && tally.door === 944
  && tally.alias === 124 && tally.never === 60 && tally.comp === 17 && doorTotal === 7140
  && pairs.every(p => p.klass !== "alias" || p.n === 0)
  && pairs.filter(p => p.comp).every(p => p.n === 32);
document.getElementById("title").textContent = ok
  ? "1128 = 944 + 124 + 60" : "COUNT MISMATCH";
document.getElementById("sub").textContent = ok
  ? "Generated here. Faces blank until touch. 17 complementary sit inside the 944, not in the sum."
  : "Generated counts did not match the locked partition.";

const filters = { door: true, alias: false, never: false, comp: false };
function syncHash() {
  const p = new URLSearchParams();
  if (faceSel !== null) p.set("f", String(faceSel).padStart(2, "0"));
  p.set("door", filters.door ? "1" : "0");
  p.set("alias", filters.alias ? "1" : "0");
  p.set("never", filters.never ? "1" : "0");
  p.set("comp", filters.comp ? "1" : "0");
  p.set("sort", document.getElementById("sort").value);
  history.replaceState(null, "", "#" + p.toString());
}
const _hp = new URLSearchParams(location.hash.slice(1));
["door", "alias", "never", "comp"].forEach(k => {
  const v = _hp.get(k);
  if (v === "1") filters[k] = true; else if (v === "0") filters[k] = false;
});
(function () {
  const sv = _hp.get("sort");
  if (sv && ["mask", "doors", "dist"].indexOf(sv) >= 0) document.getElementById("sort").value = sv;
})();
const _hf = parseInt(_hp.get("f"), 10);
const countBox = document.getElementById("counts");
function chip(key, label, n, cls) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip " + cls + (filters[key] ? " on" : "");
  b.textContent = label + " " + n;
  b.onclick = () => {
    if (key === "comp") filters.comp = !filters.comp;
    else filters[key] = !filters[key];
    b.classList.toggle("on");
    page = 0;
    render();
  };
  countBox.appendChild(b);
}
chip("door", "DOOR", tally.door, "door");
chip("alias", "ALIAS", tally.alias, "alias");
chip("never", "NEVER", tally.never, "never");
chip("comp", "COMP", tally.comp, "comp");

const phi = (1 + Math.sqrt(5)) / 2;
const V = [[0,-1,-phi],[0,-1,phi],[0,1,-phi],[0,1,phi],[-1,-phi,0],[-1,phi,0],
  [1,-phi,0],[1,phi,0],[-phi,0,-1],[phi,0,-1],[-phi,0,1],[phi,0,1]];
const edges = [];
for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
  const dx = V[i][0]-V[j][0], dy = V[i][1]-V[j][1], dz = V[i][2]-V[j][2];
  if (dx*dx + dy*dy + dz*dz < 4.2) edges.push([i, j]);
}
const edgeSet = new Set(edges.map(e => e[0] + "," + e[1]));
const faces = [];
for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) for (let k = j + 1; k < 12; k++) {
  if (edgeSet.has(i+","+j) && edgeSet.has(j+","+k) && edgeSet.has(i+","+k)) faces.push({ idx: faces.length, verts: [i, j, k], pairs: [] });
}
const shelf = pairs.slice().sort((x, y) => x.a - y.a || x.b - y.b);
const base = Math.floor(shelf.length / faces.length);
let extra = shelf.length - base * faces.length;
let cursor = 0;
faces.forEach(f => {
  const n = base + (extra > 0 ? 1 : 0);
  if (extra > 0) extra--;
  f.pairs = shelf.slice(cursor, cursor + n);
  f.pairs.forEach(p => { p.face = f.idx; });
  cursor += n;
});
const faceSum = faces.reduce((s, f) => s + f.pairs.length, 0);
document.getElementById("geom").textContent =
  V.length + " · " + edges.length + " · " + faces.length + " · Euler " +
  (V.length - edges.length + faces.length) + " · face HUD · wire hidden · tap a face";
document.getElementById("ledger").textContent =
  "Doors " + doorTotal + ". Bins 488 / 1696 / 2548 / 1864 / 544. Alias doors 0. " +
  "Each complementary pair has 32 directed doors and is already a door pair. " +
  "944+124+60+17 = 1145, not C(48,2). " +
  "Faces are a shelf of the list: " + faces.length + " sections, " +
  faces.filter(f => f.pairs.length === 57).length + " hold 57 and " +
  faces.filter(f => f.pairs.length === 56).length + " hold 56, sum " + faceSum +
  ". List order, not a door law. Each face is a browser at plate://face/NN. The document is that shelf, not an open-web page. 64/170,360 printed filed 2026-10-06, not granted here. 19/658,750 not read.";

const q = document.getElementById("q");
const sort = document.getElementById("sort");
const list = document.getElementById("list");
const shown = document.getElementById("shown");
const sheet = document.getElementById("sheet");
let page = 0;
const PAGE = 40;
let view = [];
let faceSel = null;
const faceBtn = document.createElement("button");
faceBtn.type = "button";
faceBtn.className = "chip";
faceBtn.textContent = "ALL FACES";
faceBtn.onclick = () => { closeFaceWindow(); };
document.getElementById("counts").appendChild(faceBtn);
q.oninput = () => { page = 0; render(); };
sort.onchange = () => { page = 0; render(); };
document.getElementById("close").onclick = () => sheet.classList.remove("open");
document.getElementById("prevFace").onclick = () => selectFace((faceSel === null ? 0 : (faceSel + 19) % 20));
document.getElementById("nextFace").onclick = () => selectFace((faceSel === null ? 0 : (faceSel + 1) % 20));

function filtered() {
  const query = q.value.trim().toLowerCase().replace(/\s/g, "");
  let rows = pairs.filter(p => {
    if (faceSel !== null && p.face !== faceSel) return false;
    if (filters.comp && !p.comp) return false;
    if (!filters.comp && !filters[p.klass]) return false;
    if (!query) return true;
    const blob = (p.a + "+" + p.b + p.klass + (p.comp ? "comp" : "")).toLowerCase();
    return blob.includes(query);
  });
  rows.sort((x, y) => {
    if (x.face !== y.face) return x.face - y.face;
    if (sort.value === "doors") return y.n - x.n || x.a - y.a || x.b - y.b;
    if (sort.value === "dist") return x.dist - y.dist || x.a - y.a;
    return x.a - y.a || x.b - y.b;
  });
  return rows;
}
function sectionHead(faceIdx) {
  const f = faces[faceIdx];
  const door = f.pairs.filter(p => p.klass === "door").length;
  const alias = f.pairs.filter(p => p.klass === "alias").length;
  const never = f.pairs.filter(p => p.klass === "never").length;
  const b = document.createElement("button");
  b.type = "button";
  b.className = "sec";
  b.innerHTML = "FACE " + String(faceIdx).padStart(2, "0") + " · " + f.pairs.length + " pairs" +
    "<small>" + door + " door · " + alias + " alias · " + never + " never · shelf, not a class</small>";
  b.onclick = () => selectFace(faceIdx);
  return b;
}
function selectFace(i) {
  if (faceSel === i && document.getElementById("stage").classList.contains("open")) {
    closeFaceWindow();
    return;
  }
  faceSel = i;
  page = 0;
  faceBtn.textContent = "FACE " + String(i).padStart(2, "0");
  faceBtn.classList.add("on");
  list.scrollTop = 0;
  render();
  openFace(i);
}
function closeFaceWindow() {
  faceSel = null;
  page = 0;
  faceBtn.textContent = "ALL FACES";
  faceBtn.classList.remove("on");
  document.getElementById("stage").classList.remove("open");
  const win = document.getElementById("facewin");
  win.hidden = true;
  win.classList.remove("open");
  render();
}
function openFace(i) {
  const f = faces[i];
  const door = f.pairs.filter(p => p.klass === "door").length;
  const alias = f.pairs.filter(p => p.klass === "alias").length;
  const never = f.pairs.filter(p => p.klass === "never").length;
  const win = document.getElementById("facewin");
  document.getElementById("stage").classList.add("open");
  win.hidden = false;
  win.classList.add("open");
  document.getElementById("facewinTitle").textContent = "plate://face/" + String(i).padStart(2, "0");
  document.getElementById("facewinMeta").textContent =
    "vertices " + f.verts.join(" · ") + " · shelf " + f.pairs.length +
    " · " + door + " door · " + alias + " alias · " + never + " never · cut, not a class";
  const box = document.getElementById("facewinRows");
  box.innerHTML = "";
  f.pairs.forEach(p => {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "prow";
    const color = p.klass === "door" ? "var(--door)" : p.klass === "alias" ? "var(--alias)" : "var(--never)";
    row.innerHTML = "<span class='tag' style='color:" + color + "'>" + p.klass.toUpperCase() +
      (p.comp ? " · C" : "") + "</span><span>" + p.a + " + " + p.b + "</span><span>" + p.n + "</span>";
    row.onclick = () => openPair(p);
    box.appendChild(row);
  });
}
function placeFaceWindow() {
  const win = document.getElementById("facewin");
  if (win.hidden || faceSel === null || !hitFaces.length || win.classList.contains("open")) return;
  const hit = hitFaces.find(f => f.idx === faceSel);
  if (!hit) return;
  const r = canvas.getBoundingClientRect();
  const sx = r.width / canvas.width, sy = r.height / canvas.height;
  const cx = (hit.poly[0][0] + hit.poly[1][0] + hit.poly[2][0]) / 3 * sx;
  const cy = (hit.poly[0][1] + hit.poly[1][1] + hit.poly[2][1]) / 3 * sy;
  const w = win.offsetWidth || 200, h = win.offsetHeight || 140;
  win.style.left = Math.max(8, Math.min(r.width - w - 8, cx - w / 2)) + "px";
  win.style.top = Math.max(8, Math.min(r.height - h - 8, cy + 12)) + "px";
}
function render() {
  view = filtered();
  const end = Math.min(view.length, (page + 1) * PAGE);
  shown.textContent = (faceSel === null ? "all faces · " : "face " + faceSel + " · ") + end + " of " + view.length;
  const frag = document.createDocumentFragment();
  let lastFace = -1;
  for (let i = 0; i < end; i++) {
    const p = view[i];
    if (p.face !== lastFace) {
      frag.appendChild(sectionHead(p.face));
      lastFace = p.face;
    }
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row";
    const color = p.klass === "door" ? "var(--door)" : p.klass === "alias" ? "var(--alias)" : "var(--never)";
    row.innerHTML = "<span class='tag' style='color:" + color + "'>" + p.klass.toUpperCase() +
      (p.comp ? " · C" : "") + "</span><span>" + p.a + " + " + p.b + "</span><span>" +
      p.n + "</span>";
    row.onclick = () => openPair(p);
    frag.appendChild(row);
  }
  if (end < view.length) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "chip";

      pctx.strokeStyle = FC[i];
      pctx.lineWidth = 2;
      pctx.beginPath(); pctx.arc(x, y, i === 1 ? 9 : 6, 0, Math.PI * 2); pctx.stroke();
      pctx.fillStyle = "#fff";
      pctx.beginPath(); pctx.arc(x, y, 2, 0, Math.PI * 2); pctx.fill();
    });
    if (syncing && syncFrozen) {
      pctx.fillStyle = "rgba(255,255,255,0.15)";
      pctx.fillRect(8, H - 14, W - 16, 5);
      pctx.fillStyle = "#22ff88";
      pctx.fillRect(8, H - 14, (W - 16) * Math.min(1, syncHold / 1200), 5);
    }
  } else {
    hs.seen = false; hs.dx *= 0.85; hs.dy *= 0.85;
    if (syncing) { syncFrozen = null; plab.textContent = "SHOW HAND"; }
    else plab.textContent = "HAND";
  }
  requestAnimationFrame(loop);
}
window.addEventListener("resize", () => { if (ready) sizePip(); });
</script>
