<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hologram test</title>
<style>
body{background:#07070c;margin:0;display:flex;justify-content:center;padding:20px}
.holo-wrap{position:relative;width:min(400px,90vw)}
.holo-wrap::before{content:"";position:absolute;left:8%;right:8%;bottom:1%;height:4px;z-index:2;pointer-events:none;
background:radial-gradient(ellipse at center,rgba(184,245,230,.75),transparent 70%)}
#holoCanvas{display:block;width:100%;aspect-ratio:480/840;touch-action:pan-y}

.holo-alive{animation:holo-flick 7s ease-in-out infinite}
@keyframes holo-flick{0%,100%{opacity:1}93%{opacity:.965}94%{opacity:1}}
</style></head><body>
<div class="holo-wrap"><canvas id="holoCanvas"></canvas></div>
